<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#123736"><title>Mario - First Person Adventure</title><link rel="canonical" href="https://play.aadityamore.com/mario/"><meta name="description" content="Explore a 3D Mushroom Kingdom, collect coins, stomp Goombas, and race to the flag in a first-person browser platformer."><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>



@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-border: var(--border);
  --color-ring: var(--ring);
  --font-sans: Arial, Helvetica, sans-serif;
}
:root,
.dark {
  --background: #111c20;
  --foreground: #fffdf4;
  --primary: #f3473b;
  --primary-foreground: #fff;
  --border: #ffffff26;
  --ring: #ffce42;
  --card: #182b31;
  --card-foreground: #fffdf4;
  --muted: #294047;
  --muted-foreground: #c1d2d6;
  --radius: 0.75rem;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--foreground);
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: 0.65;
}
button:focus-visible,
a:focus-visible {
  outline: 3px solid #ffdc64;
  outline-offset: 5px;
}
button {
  border: 0;
}
a {
  color: inherit;
  text-decoration: none;
}
.game-shell {
  position: relative;
  height: 100svh;
  min-height: 600px;
  overflow: hidden;
  background: #91d8ed;
  isolation: isolate;
}
.world-canvas,
.scene-shade {
  position: absolute;
  inset: 0;
}
.world-canvas canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.scene-shade {
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(6, 30, 30, 0.68), transparent 68%),
    linear-gradient(
      0deg,
      rgba(7, 29, 30, 0.82),
      transparent 43%,
      transparent 85%,
      rgba(12, 36, 39, 0.16)
    );
  transition: opacity 0.5s;
}
.topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 106px;
  padding: 0 4.1%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  z-index: 20;
}
.brand {
  background: none;
  padding: 0;
  color: inherit;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  background: #ef433c;
  color: white;
  border-radius: 50%;
  font-style: italic;
  font-size: 26px;
  box-shadow: 0 3px 0 #b42b28;
}
.brand-slash {
  display: inline-block;
  margin: 0 12px;
  color: #d0ddda75;
  font-weight: 400;
}
.brand-sub {
  font-size: 12px;
  letter-spacing: 0.15em;
  font-weight: 600;
}
.world-label {
  font-size: 11px;
  letter-spacing: 0.16em;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
}
.status-dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: #c0ed97;
  box-shadow: 0 0 12px #c0ed9740;
}
.label-divider {
  height: 13px;
  width: 1px;
  background: #fff5;
  margin: 0 2px;
}
.toolbar {
  display: flex;
  gap: 9px;
}
.icon-button {
  height: 40px;
  width: 40px;
  border: 1px solid #ffffff47;
  border-radius: 50%;
  background: #12373b26;
  backdrop-filter: blur(12px);
  color: #fff;
  display: grid;
  place-items: center;
  transition:
    background 0.2s,
    transform 0.2s;
}
.icon-button:hover {
  background: #ffffff30;
  transform: translateY(-1px);
}
.level-stamp {
  position: absolute;
  right: 4.1%;
  top: 138px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.level-stamp > span {
  font-size: 48px;
  font-weight: 900;
  letter-spacing: -0.06em;
  line-height: 1;
  color: #fff8;
}
.level-stamp > div {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.17em;
  border-left: 1px solid #ffffff50;
  padding-left: 17px;
}
.level-stamp small {
  display: block;
  font-size: 12px;
  letter-spacing: 0;
  font-weight: 400;
  margin-top: 7px;
  color: #eef7eecc;
}
.intro {
  position: absolute;
  left: 7.5%;
  top: 23%;
  width: 530px;
  max-width: 70%;
  z-index: 3;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.23em;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  color: #ffdf87;
}
.little-line {
  height: 2px;
  width: 25px;
  background: #ffdf87;
}
.intro h1 {
  font-size: clamp(70px, 7.5vw, 116px);
  font-weight: 950;
  letter-spacing: -0.055em;
  line-height: 0.87;
  margin: 24px 0 17px;
  text-shadow: 0 5px 0 #0d34372e;
}
.intro h1 > span:not(.title-dot) {
  color: #ffda65;
}
.title-dot {
  color: #f45b4d;
}
.perspective-label {
  font-size: clamp(11px, 1.05vw, 15px);
  font-weight: 700;
  letter-spacing: 0.24em;
  margin-top: 22px;
}
.intro p {
  font-size: 15px;
  color: #e0ede2dd;
  line-height: 1.65;
  margin: 20px 0 24px;
}
.play-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 36px;
  background: #f64d40;
  color: #fff;
  min-width: 212px;
  padding: 19px 23px;
  font-weight: 700;
  font-size: 17px;
  border-radius: 8px;
  box-shadow: 0 4px 0 #a92e24;
  transition:
    transform 0.18s,
    background 0.18s,
    box-shadow 0.18s;
}
.play-button:hover {
  background: #ff6254;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #a92e24;
}
.play-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #a92e24;
}
.play-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 9px;
  letter-spacing: 0.12em;
  margin-top: 25px;
  color: #c9dbcaad;
  font-weight: 600;
}
.play-meta .status-dot {
  width: 5px;
  height: 5px;
}
.mission-card {
  position: absolute;
  right: 5%;
  bottom: 150px;
  width: 235px;
  border: 1px solid #ffffff3b;
  border-radius: 13px;
  padding: 24px;
  background: #183e3a47;
  backdrop-filter: blur(18px);
  box-shadow: 0 10px 40px #12312712;
}
.mission-icon {
  color: #ffdc78;
  margin-bottom: 17px;
}
.mission-card > span {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #cee1d4b5;
}
.mission-card h2 {
  font-size: 18px;
  letter-spacing: -0.035em;
  margin: 9px 0;
}
.mission-card p {
  font-size: 12px;
  line-height: 1.65;
  color: #e0eddfaa;
  margin: 10px 0 19px;
}
.mission-line {
  border-top: 1px solid #ffffff26;
  padding-top: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: #f5f5dbcc;
}
.start-footer {
  position: absolute;
  bottom: 0;
  left: 4.1%;
  right: 4.1%;
  height: 92px;
  border-top: 1px solid #ffffff24;
  display: flex;
  align-items: center;
  gap: 32px;
}
.control-item {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 12px;
  color: #deeee1ba;
}
.key-group {
  display: flex;
  gap: 3px;
}
kbd {
  font-family: inherit;
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  height: 25px;
  padding: 0 6px;
  border: 1px solid #ffffff50;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  color: #f3f6ea;
  background: #ffffff09;
  box-shadow: 0 2px 0 #ffffff12;
}
.space-key {
  padding: 0 11px;
  font-size: 9px;
  letter-spacing: 0.08em;
}
.footer-note {
  margin-left: auto;
  display: flex;
  gap: 18px;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: #d2e1d28a;
}
.footer-note span {
  color: #ffdc78;
  font-size: 18px;
}
.is-playing .scene-shade {
  opacity: 0;
}
.is-playing .topbar {
  background: linear-gradient(#17363461, transparent);
  height: 90px;
}
.hud {
  position: absolute;
  left: 4.1%;
  top: 112px;
  display: flex;
  gap: 27px;
  background: #163b384d;
  backdrop-filter: blur(14px);
  border: 1px solid #ffffff40;
  border-radius: 12px;
  padding: 16px 22px;
  pointer-events: none;
  z-index: 2;
}
.hud-stat {
  display: flex;
  gap: 12px;
  align-items: center;
}
.hud-stat + .hud-stat {
  border-left: 1px solid #ffffff2b;
  padding-left: 24px;
}
.hud-stat small {
  display: block;
  font-size: 9px;
  letter-spacing: 0.14em;
  font-weight: 700;
  color: #ffffffb0;
  margin-bottom: 5px;
}
.hud-stat strong {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.hud-stat strong span {
  font-size: 12px;
  color: #fff9;
  font-weight: 400;
}
.coin-icon {
  width: 19px;
  height: 25px;
  background: #ffd143;
  border: 3px solid #ffe99a;
  border-radius: 50%;
  box-shadow: 2px 0 0 #c58a17;
  display: block;
}
.crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fffc;
  box-shadow: 0 0 0 2px #243e452e;
  pointer-events: none;
}
.goal-pill {
  position: absolute;
  right: 4.1%;
  top: 115px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #163b384d;
  backdrop-filter: blur(12px);
  border: 1px solid #ffffff40;
  border-radius: 30px;
  padding: 13px 18px;
  font-size: 12px;
}
.goal-track {
  display: block;
  width: 60px;
  height: 4px;
  border-radius: 4px;
  background: #fff3;
  overflow: hidden;
  margin-left: 7px;
}
.goal-track [data-slot='progress-track'] {
  height: 4px;
  background: #ffffff33;
}
.goal-track [data-slot='progress-indicator'] {
  height: 4px;
  background: #ffdb68;
}
.playing-hint {
  position: absolute;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  white-space: nowrap;
  background: #1937347a;
  padding: 9px 16px;
  border-radius: 8px;
  backdrop-filter: blur(12px);
}
.playing-hint > span {
  margin: 0 5px;
  color: #fff7;
}
.game-notice {
  position: absolute;
  left: 50%;
  top: 28%;
  transform: translateX(-50%);
  background: #183b39bb;
  backdrop-filter: blur(12px);
  padding: 13px 24px;
  border: 1px solid #ffffff45;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 600;
  color: #ffe3a0;
  pointer-events: none;
  z-index: 15;
  white-space: nowrap;
}
.state-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #0b262961;
  backdrop-filter: blur(7px);
  z-index: 10;
}
.state-card {
  text-align: center;
  padding: 38px 46px 32px;
  background: #163737e8;
  border: 1px solid #ffffff30;
  border-radius: 18px;
  max-width: 90%;
  box-shadow: 0 30px 100px #041c2440;
}
.state-icon {
  color: #ffdb76;
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}
.state-card .eyebrow {
  justify-content: center;
}
.state-card h2 {
  font-size: 40px;
  letter-spacing: -0.055em;
  margin: 14px 0;
}
.state-card p {
  color: #d5e4d8bc;
  font-size: 14px;
  margin: 16px 0 25px;
  line-height: 1.6;
}
.state-card .play-button {
  margin: 0 auto;
}
.text-button {
  background: none;
  color: #dce6d7b3;
  font-size: 12px;
  padding: 14px;
  margin-top: 7px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.touch-controls {
  display: none;
}
.time-low {
  color: #ff8873;
}
.intro .load-error {
  font-size: 13px;
  color: #fff1c4;
  max-width: 370px;
}
.damage-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 130px #ff2c297a;
  z-index: 6;
  opacity: 0;
  transition: opacity 0.1s;
}
.damage-flash.active {
  opacity: 1;
}
@media (min-width: 1600px) {
  .intro {
    top: 25%;
  }
  .intro h1 {
    font-size: 132px;
  }
  .intro p {
    font-size: 17px;
  }
  .start-footer {
    height: 110px;
  }
  .mission-card {
    bottom: 170px;
    right: 7.5%;
  }
}
@media (max-height: 760px) and (min-width: 801px) {
  .intro {
    top: 20%;
  }
  .intro h1 {
    font-size: 80px;
    margin: 16px 0;
  }
  .intro p {
    margin: 14px 0 18px;
  }
  .intro .play-meta {
    margin-top: 18px;
  }
  .mission-card {
    bottom: 120px;
  }
  .start-footer {
    height: 76px;
  }
  .level-stamp {
    top: 115px;
  }
}
@media (max-width: 1000px) {
  .world-label {
    display: none;
  }
  .mission-card {
    right: 4%;
    width: 200px;
  }
  .intro {
    left: 6%;
  }
  .footer-note {
    display: none;
  }
  .start-footer {
    justify-content: center;
  }
  .goal-pill {
    top: 200px;
  }
  .hud {
    gap: 20px;
  }
  .hud-stat + .hud-stat {
    padding-left: 20px;
  }
}
@media (max-width: 700px) {
  .game-shell {
    min-height: 520px;
  }
  .topbar {
    height: 82px;
    padding: 0 6%;
    gap: 10px;
  }
  .brand-sub {
    font-size: 9px;
    letter-spacing: 0.09em;
  }
  .brand-slash {
    margin: 0 8px;
  }
  .brand {
    font-size: 15px;
    gap: 8px;
  }
  .brand-mark {
    width: 33px;
    height: 33px;
    font-size: 23px;
  }
  .icon-button {
    width: 35px;
    height: 35px;
  }
  .toolbar {
    gap: 6px;
  }
  .fullscreen-button {
    display: none;
  }
  .level-stamp {
    top: 111px;
    right: 6%;
  }
  .level-stamp > span {
    font-size: 36px;
  }
  .level-stamp > div {
    font-size: 9px;
    padding-left: 12px;
  }
  .level-stamp small {
    display: none;
  }
  .intro {
    top: auto;
    bottom: 150px;
    max-width: 90%;
    width: auto;
    left: 7%;
  }
  .intro h1 {
    font-size: 76px;
    margin-top: 19px;
  }
  .intro p {
    font-size: 14px;
    max-width: 305px;
    margin: 17px 0 21px;
  }
  .perspective-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    margin-top: 18px;
  }
  .intro .eyebrow {
    font-size: 9px;
  }
  .play-button {
    padding: 17px 21px;
    min-width: 200px;
    font-size: 16px;
  }
  .play-meta {
    font-size: 8px;
    gap: 7px;
    margin-top: 20px;
  }
  .mission-card {
    display: none;
  }
  .scene-shade {
    background:
      linear-gradient(90deg, #092b335e, transparent),
      linear-gradient(0deg, #092a2ef2, transparent 100%);
  }
  .start-footer {
    left: 7%;
    right: 7%;
    gap: 18px;
    height: 103px;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-content: center;
    row-gap: 13px;
  }
  .control-item {
    font-size: 10px;
    gap: 8px;
  }
  .control-item:last-of-type {
    display: none;
  }
  kbd {
    min-width: 20px;
    height: 22px;
    font-size: 9px;
    padding: 0 4px;
  }
  .key-group {
    gap: 2px;
  }
  .hud {
    top: 95px;
    left: 5%;
    right: 5%;
    padding: 13px 15px;
    justify-content: space-between;
    gap: 9px;
  }
  .hud-stat {
    gap: 8px;
  }
  .hud-stat + .hud-stat {
    padding-left: 14px;
  }
  .hud-stat strong {
    font-size: 19px;
  }
  .hud-stat small {
    font-size: 8px;
  }
  .hud-stat.score {
    display: none;
  }
  .goal-pill {
    right: 5%;
    top: 178px;
    padding: 10px 14px;
    font-size: 11px;
  }
  .playing-hint {
    display: none;
  }
  .state-card {
    padding: 30px 23px;
  }
  .state-card h2 {
    font-size: 34px;
  }
  .state-card p {
    font-size: 13px;
  }
  .game-notice {
    top: 31%;
    font-size: 12px;
    max-width: 90%;
    white-space: normal;
    text-align: center;
  }
}
@media (pointer: coarse) {
  .touch-controls {
    display: flex;
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: 34px;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
    z-index: 4;
  }
  .touch-pad {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    background: #183a3945;
    border: 1px solid #ffffff70;
    display: grid;
    place-items: center;
    pointer-events: auto;
    touch-action: none;
    backdrop-filter: blur(6px);
    user-select: none;
  }
  .touch-pad span {
    font-size: 47px;
    color: #fff9;
  }
  .touch-jump {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    color: #fff;
    background: #f3473bcc;
    border: 1px solid #ffffff70;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 0.1em;
    pointer-events: auto;
    touch-action: none;
  }
  .playing-hint {
    display: none;

  .start-footer:after {
    content: 'Drag to look · Left joystick to move · Tap to jump';

  .start-footer .control-item {
    display: none;
  }
}
.graphics-control {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid #ffffff47;
  border-radius: 22px;
  background: #12373b80;
  backdrop-filter: blur(12px);
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  transition:
    background 0.2s,
    border-color 0.2s;
}
.graphics-control > span {
  display: flex;
  gap: 5px;
  align-items: center;
}
.graphics-control small {
  font-size: 10px;
  min-width: 23px;
  color: #d6e4e2;
}
.graphics-control:has(:disabled) {
  cursor: wait;
  opacity: 0.65;
}
.graphics-on {
  background: #183a25d9;
  border-color: #b3e57b;
}
.graphics-on small {
  color: #d4ffa8;
}
.graphics-switch[data-slot='switch'] {
  position: relative;
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  width: 30px;
  height: 18px;
  min-height: 18px;
  border: 1px solid #ffffff60;
  border-radius: 20px;
  background: #ffffff24;
  padding: 1px;
  outline-offset: 4px;
}
.graphics-switch[data-checked] {
  background: #c4ec8e;
  border-color: #c4ec8e;
}
.graphics-switch [data-slot='switch-thumb'] {
  display: block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #f6fff0;
  transform: translateX(0);
  transition: transform 0.2s;

}
.graphics-switch:focus-visible {

}

  position: absolute;

  height: 1px;
  padding: 0;
  margin: -1px;

  clip-path: inset(50%);
  white-space: nowrap;
}

  border-radius: 10px;
  background: #163737ed;
  color: #ffe3a0;
  font-size: 13px;
  line-height: 1.5;
}
.graphics-switch::after {
  display: none;
}

  }

  .graphics-switch [data-slot='switch-thumb'] {
